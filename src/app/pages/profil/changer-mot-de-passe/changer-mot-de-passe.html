<div class="row m-3">
  <div class="card col-md-4 text-center p-4 me-3">
    <div class="col ">
      <div class="mb-3">
        <img src="assets/product.png" class="rounded-circle" width="200px" height="200px" alt="Profile Picture">
      </div>
      <div>
        <h2>Nom Prénom</h2>
        <small class="form-text text-muted">Adresse, Ville, 12345</small>
      </div>
    </div>
  </div>
  <div class="card col-md-7 p-3">
    <form>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Ancien mot de passe">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Nouveau mot de passe">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Confirmer mot de passe">
      </div>
    </form>
    <div class="row mt-3">
      <div class="col-md-12 text-end">
        <button type="button" class="btn btn-danger m-3">
          <i class="fa-solid fa-ban"></i>&nbsp;
          Annuler
        </button>
        <button type="button" class="btn btn-success">
          <i class="fa-solid fa-floppy-disk"></i>&nbsp;
          Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>
