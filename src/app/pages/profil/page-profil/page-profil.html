<div class="row m-3">
  <div class="card col-md-4 text-center p-4 me-3">
    <div class="col ">
      <div class="mb-3">
        <img src="assets/product.png" class="rounded-circle" width="200px" height="200px" alt="Profile Picture">
      </div>
      <div>
        <h2>Nom Prénom</h2>
        <small class="form-text text-muted">Adresse, Ville, 12345</small>
      </div>
      <div class="col mt-3 d-flex justify-content-around">
        <button type="button" class="btn btn-primary">
          <i class="fa-solid fa-pencil"></i>&nbsp;
          Modifier
        </button>
        <button type="button" class="btn btn-warning" (click)="modifierMotDePasse()">
          <i class="fa-solid fa-lock"></i>&nbsp;
          Changer le mot de passe
        </button>
      </div>
    </div>
  </div>
  <div class="card col-md-7 p-0">
    <table class="table">
      <tbody>
        <tr>
          <th scope="row">Nom complet</th>
          <td>nom prenom</td>
        </tr>
        <tr>
          <th scope="row">Email</th>
          <td>adresse@email.com</td>
        </tr>
        <tr>
          <th scope="row">Téléphone</th>
          <td>00237 655 08 00 44</td>
        </tr>
        <tr>
          <th scope="row">Adresse</th>
          <td>Adresse, Ville, 12345</td>
        </tr>
        <tr>
          <th scope="row">Entreprise</th>
          <td>Nom entreprise</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
