<div class="row mb-1 mr-0 custom-border">
  <div class="col-md-2 p-1 border-right text-center mb-1 mt-1">
      <img src="assets/product.png" alt="" width="80px" height="80px">
  </div>
  <!-- Details des stocks -->
  <div class="col-md-4 border-right mb-1 mt-1">
    <div class="col">
      <div class="row">
        <div class="col-md-1"><i class="fa-solid fa-circle-info blue-color"></i></div>
        <div class="col-md-11">Code article</div>
      </div>
      <div class="row">
        <div class="col-md-1"><i class="fa-solid fa-circle-info blue-color"></i></div>
        <div class="col-md-11">Designation</div>
      </div>
      <div class="row">
        <div class="col-md-1"><i class="fa-solid fa-dollar-sign blue-color"></i></div>
        <div class="col-md-11">Prix HT</div>
      </div>
      <div class="row">
        <div class="col-md-1"><i class="fa-solid fa-dollar-sign blue-color"></i></div>
        <div class="col-md-11">Prix TTC</div>
      </div>
    </div>
  </div>
  <!-- Details mvt des stocks -->
  <div class="col-md-4 border-right mb-1 mt-1">
    <div class="row">
      <div class="col-md-10 text-center">
        <div class="row">
          <div class="col-md-12">
            <h3>Stock actuel</h3>
          </div>
          <div class="col-md-12">
            <h3>139</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Boutons actions -->
  <div class="col-md-2 mb-1 mt-1">
    <div class="row">
      <div class="col-md-12 text-center">
        <button type="button" class="btn btn-link" data-bs-toggle="modal" data-bs-target="#exampleModal">
          <i class="fa-brands fa-stack-overflow"></i>&nbsp;Correction de stock
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Correction de stock</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <input type="text" class="form-control" id="recipient-name" placeholder="Quantité">
          </div>
          <div class="mb-3">
            <select class="form-control" name="" id="">
              <option value="">Correction positive</option>
              <option value="">Correction négative</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="fa-solid fa-ban"></i>&nbsp;Annuler</button>
        <button type="button" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i>&nbsp;Enregistrer</button>
      </div>
    </div>
  </div>
</div>
